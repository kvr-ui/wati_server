services:
  # Next.js Application (MongoDB is cloud-hosted — no local DB container)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: focas-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
