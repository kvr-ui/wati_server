services:
  # Next.js Application (MongoDB is cloud-hosted — no local DB container)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: focas-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      WEBSITE_URL: ${WEBSITE_URL:-http://localhost:3100}
      WEBSITE_ORIGIN: ${WEBSITE_ORIGIN:-http://localhost:3100}
